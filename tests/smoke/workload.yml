---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload
data:
  nginx.conf: |
    user nginx;
    worker_processes  3;
    error_log  /var/log/nginx/error.log;
    events {
      worker_connections 10240;
    }
    http {
      log_format main '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $bytes_sent '
                      '"$http_referer" "$http_user_agent" "$gzip_ratio"';
      access_log /var/log/nginx/access.log main;
      server {
        listen 80;
        server_name  _;
        location / {
          return 200;
        }
        # Location for API discovery test
        location /api-discovery-test {
            add_header Api-Discovery-Header "Hello, I am header!";
            return 200 '{"json_response": "Hello, I am json"}';
            default_type application/json;
        }
        # Location for MCP tool detection test
        location ~ ^/api-discovery-test/mcp/ {
            default_type application/json;
            return 200 '{"jsonrpc":"2.0","id":1,"result":{"tools":[{"name":"get_weather","title":"Get Weather","description":"Get current weather for a city","inputSchema":{"type":"object","properties":{"city":{"type":"string","description":"City name"}},"required":["city"]}}]}}';
        }
        # Location for Blocking Tor Source Type
        location /blocking-by-tor-test {
              add_header Block-by-Tor "Hello, I am header!";
              return 200 '{"json_response": "Hello, I am json"}';
              default_type application/json;
        }
        # Some mocks for test_api_abuse_prevention.py
        location /.git {
            if ($http_custom_id) {
                return 400;
            }
            return 200;
        }
        location /wallarm-application/admin {
            return 401;
        }
        location /api/v2 {
            if ($http_custom_id) {
                return 502;
            }
            return 200;
        }
        location /smoke-auto-forced-browsing/ {
            return 404;
        }
        # ptrav_etc_passwd: passive detect matches "root:[x*]:0:0:root:/root" in the
        # response (test_triggers_incidents_exceeded.py). Mirrors smoke-tests
        # data/ingress_conf/workload_common.yaml and aio-deploy backend_nginx.conf.
        location /passive-detect/ptrav {
            default_type text/plain;
            return 200 'root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\n';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
spec:
  selector:
    matchLabels:
      app: workload
  replicas: 1
  template:
    metadata:
      labels:
        app: workload
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: workload
            items:
              - key: nginx.conf
                path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: workload
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: workload
